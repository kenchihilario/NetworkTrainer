<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>what we propose for it to look like</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#fff;color:#111;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.4}
main{max-width:960px;margin:0 auto;padding:20px 16px 32px}
h1{font-size:18px;font-weight:normal;margin:0 0 12px}
#wrap{position:relative;width:100%;height:min(70vh,520px);min-height:320px;touch-action:none;cursor:grab;overflow:hidden;background:#f6f6f4;border:1px solid #cfcfcf}
#c{width:100%;height:100%;display:block}
#labels{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
#fallback{padding:20px}
.controls{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.controls span{margin-right:4px}
button{font:inherit;background:#fff;color:#111;border:1px solid #999;padding:5px 10px;cursor:pointer;border-radius:0}
button:hover{background:#eee}
button[aria-pressed="true"]{background:#111;color:#fff;border-color:#111}
button:focus-visible{outline:2px solid #378ADD;outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
</style>
</head>
<body>
<main>
<h1>what we propose for it to look like</h1>
<h2 class="sr-only">Interactive 3D model: three laptops connect through a fault injection box to a switch. Use the buttons to choose which laptop's cable is cut.</h2>
<div id="wrap">
<canvas id="c"></canvas>
<div id="labels"></div>
<p id="fallback" hidden>This 3D view needs WebGL and an internet connection to load three.js.</p>
</div>
<div class="controls" id="controls">
<span>Cut cable:</span>
<button type="button" data-i="0" aria-pressed="false">Laptop 1</button>
<button type="button" data-i="1" aria-pressed="true">Laptop 2</button>
<button type="button" data-i="2" aria-pressed="false">Laptop 3</button>
<button type="button" data-i="-1" aria-pressed="false">None</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
var wrap=document.getElementById('wrap'),canvas=document.getElementById('c'),labelsEl=document.getElementById('labels');
if(typeof THREE==='undefined'){document.getElementById('fallback').hidden=false;return;}
var renderer;
try{renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true,alpha:true});}
catch(e){document.getElementById('fallback').hidden=false;return;}
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
var scene=new THREE.Scene();
var camera=new THREE.PerspectiveCamera(38,1.6,0.1,100);
var root=new THREE.Group();scene.add(root);
scene.add(new THREE.AmbientLight(0xffffff,0.75));
var sun=new THREE.DirectionalLight(0xffffff,0.75);sun.position.set(6,10,8);scene.add(sun);
var grid=new THREE.GridHelper(26,26,0xbbbbbb,0xbbbbbb);grid.material.transparent=true;grid.material.opacity=0.5;root.add(grid);

var BLUE=0x378ADD,RED=0xE24B4A,GREEN=0x97C459;
var labels=[];
function mat(c){return new THREE.MeshLambertMaterial({color:c});}
function box(w,h,d,c,x,y,z,parent){var m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));m.position.set(x,y,z);(parent||root).add(m);return m;}
function makeTex(w,h,draw){var cv=document.createElement('canvas');cv.width=w;cv.height=h;var ctx=cv.getContext('2d');draw(ctx,w,h);var t=new THREE.CanvasTexture(cv);return{tex:t,ctx:ctx,w:w,h:h,draw:draw,redraw:function(a,b){draw(ctx,w,h,a,b);t.needsUpdate=true;}};}
function anchor(x,y,z,text){var o=new THREE.Object3D();o.position.set(x,y,z);root.add(o);var el=document.createElement('div');el.textContent=text;el.style.cssText='position:absolute;left:0;top:0;font-size:12px;padding:1px 6px;background:#fff;color:#111;border:1px solid #bbb;white-space:nowrap;';labelsEl.appendChild(el);var L={o:o,el:el};labels.push(L);return L;}
function cable(p0,p1,color,sag){var mid=new THREE.Vector3().addVectors(p0,p1).multiplyScalar(0.5);mid.y=Math.min(p0.y,p1.y)-sag;var curve=new THREE.CatmullRomCurve3([p0,new THREE.Vector3().lerpVectors(p0,mid,0.6),mid,new THREE.Vector3().lerpVectors(mid,p1,0.4),p1]);var m=new THREE.Mesh(new THREE.TubeGeometry(curve,48,0.05,8,false),mat(color));root.add(m);return m;}

var ips=['192.168.1.11','192.168.1.12','192.168.1.13'];
var laptops=[];
function laptop(x,z,idx){
  var g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=-Math.PI/2;g.userData.idx=idx;root.add(g);
  box(1.6,0.08,1.1,0x5F5E5A,0,0.04,0,g);box(1.2,0.02,0.5,0x444441,0,0.09,0.15,g);
  var hinge=new THREE.Group();hinge.position.set(0,0.08,-0.55);hinge.rotation.x=-0.3;g.add(hinge);
  box(1.6,1.0,0.06,0x2C2C2A,0,0.5,0,hinge);
  var ip=ips[idx];
  var t=makeTex(256,160,function(c,w,h,bad){
    c.fillStyle='#0b1b2b';c.fillRect(0,0,w,h);
    c.font='bold 16px monospace';c.fillStyle='#97C459';c.fillText('C:\\> ping '+ip,10,30);
    c.fillStyle=bad?'#F09595':'#97C459';
    var line=bad?'Request timed out.':'Reply from '+ip;
    c.fillText(line,10,56);c.fillText(line,10,80);
    if(bad){c.fillStyle='#F09595';c.fillText('Packet loss = 100%',10,110);}
  });
  t.redraw(false);
  var s=new THREE.Mesh(new THREE.PlaneGeometry(1.46,0.88),new THREE.MeshBasicMaterial({map:t.tex}));
  s.position.set(0,0.5,0.034);hinge.add(s);
  laptops.push({group:g,screen:t});
}
laptop(-5.4,-2.4,0);laptop(-5.4,0,1);laptop(-5.4,2.4,2);

// fault injection box
box(3,1.2,1.9,0x0F6E56,0,0.6,0);
box(3.04,0.08,1.94,0x1D9E75,0,1.22,0);
box(0.9,0.03,0.45,0x1a1a1a,-0.7,1.28,0.45);
var leds=[],ledX=[-0.9,0,0.9];
for(var i=0;i<3;i++){var lm=new THREE.MeshBasicMaterial({color:GREEN});var l=new THREE.Mesh(new THREE.SphereGeometry(0.09,16,16),lm);l.position.set(ledX[i],1.3,-0.6);root.add(l);leds.push(lm);}
var jz=[-0.6,0,0.6];
for(var j=0;j<3;j++){box(0.22,0.28,0.3,0x1a1a1a,-1.6,0.6,jz[j]);box(0.22,0.28,0.3,0x1a1a1a,1.6,0.6,jz[j]);}

// switch
box(2.2,0.5,1.5,0x444441,5.1,0.25,0);
for(var q=0;q<5;q++){box(0.05,0.14,0.18,0x1a1a1a,3.99,0.25,-0.56+q*0.28);}

// cables
var lz=[-2.4,0,2.4],sw=[-0.56,-0.28,0];
var cablesIn=[],cablesOut=[];
for(var k=0;k<3;k++){
  cablesIn.push(cable(new THREE.Vector3(-4.7,0.18,lz[k]),new THREE.Vector3(-1.72,0.6,jz[k]),BLUE,0.25));
  cablesOut.push(cable(new THREE.Vector3(1.72,0.6,jz[k]),new THREE.Vector3(3.92,0.25,sw[k]),BLUE,0.2));
}

// phone
var ph=new THREE.Group();ph.position.set(0,0,3.7);root.add(ph);
var body=new THREE.Group();body.position.set(0,0.75,0);body.rotation.x=-0.3;ph.add(body);
box(0.85,1.5,0.08,0x2C2C2A,0,0,0,body);
var phoneTex=makeTex(128,256,function(c,w,h,sel){
  c.fillStyle='#E6F1FB';c.fillRect(0,0,w,h);
  c.fillStyle='#0C447C';c.font='bold 15px sans-serif';c.fillText('NetFault',32,24);
  var ys=[46,92,138],nm=['Laptop 1','Laptop 2','Laptop 3'];
  for(var a=0;a<3;a++){c.fillStyle=(a===sel)?'#E24B4A':'#85B7EB';c.fillRect(12,ys[a],104,36);c.fillStyle=(a===sel)?'#ffffff':'#042C53';c.font='14px sans-serif';c.fillText(nm[a],24,ys[a]+23);}
  c.fillStyle='#0F6E56';c.fillRect(12,190,104,36);c.fillStyle='#ffffff';c.font='bold 14px sans-serif';c.fillText('Restore',34,213);
});
var scr=new THREE.Mesh(new THREE.PlaneGeometry(0.76,1.4),new THREE.MeshBasicMaterial({map:phoneTex.tex}));scr.position.set(0,0,0.042);body.add(scr);

// wifi arcs
var wf=new THREE.Group();wf.position.set(0,1.55,3.55);root.add(wf);
var radii=[0.45,0.8,1.15];
for(var w2=0;w2<3;w2++){var arc=new THREE.Mesh(new THREE.TorusGeometry(radii[w2],0.03,8,40,Math.PI/2),new THREE.MeshBasicMaterial({color:0xEF9F27}));arc.rotation.z=Math.PI/4;wf.add(arc);}
wf.rotation.x=-Math.PI/2+0.35;

// labels
var lapLabels=[
  anchor(-5.4,1.6,-2.4,'Laptop 1'),
  anchor(-5.4,1.6,0,'Laptop 2'),
  anchor(-5.4,1.6,2.4,'Laptop 3')
];
anchor(0,2.1,0,'Fault injection box');
anchor(5.1,1.0,0,'Switch');
anchor(0,2.6,3.7,'Phone');

// state
var cut=1;
var btns=document.querySelectorAll('#controls button');
function apply(){
  for(var i=0;i<3;i++){
    var bad=(i===cut);
    cablesIn[i].material.color.setHex(bad?RED:BLUE);
    cablesOut[i].material.color.setHex(bad?RED:BLUE);
    leds[i].color.setHex(bad?RED:GREEN);
    laptops[i].screen.redraw(bad);
    lapLabels[i].el.textContent='Laptop '+(i+1)+(bad?' (cut)':'');
  }
  phoneTex.redraw(cut);
  for(var b=0;b<btns.length;b++){btns[b].setAttribute('aria-pressed',String(parseInt(btns[b].getAttribute('data-i'),10)===cut));}
}
for(var bi=0;bi<btns.length;bi++){btns[bi].addEventListener('click',function(){cut=parseInt(this.getAttribute('data-i'),10);apply();});}
apply();

// view
var yaw=-0.45,pitch=0,dragging=false,touched=false,lx=0,ly=0,sx=0,sy=0,dist=15.5,w=680,h=430;
function resize(){w=wrap.clientWidth||680;h=wrap.clientHeight||430;renderer.setSize(w,h,false);camera.aspect=w/h;dist=15.5*Math.max(1,1.55/camera.aspect);camera.updateProjectionMatrix();}
resize();window.addEventListener('resize',resize);

var ray=new THREE.Raycaster(),mouse=new THREE.Vector2();
function pick(e){
  var r=wrap.getBoundingClientRect();
  mouse.x=((e.clientX-r.left)/r.width)*2-1;
  mouse.y=-((e.clientY-r.top)/r.height)*2+1;
  ray.setFromCamera(mouse,camera);
  var groups=laptops.map(function(l){return l.group;});
  var hits=ray.intersectObjects(groups,true);
  if(!hits.length)return;
  var o=hits[0].object;
  while(o&&o.userData.idx===undefined)o=o.parent;
  if(o){var n=o.userData.idx;cut=(cut===n)?-1:n;apply();}
}
wrap.addEventListener('pointerdown',function(e){dragging=true;touched=true;lx=sx=e.clientX;ly=sy=e.clientY;wrap.style.cursor='grabbing';try{wrap.setPointerCapture(e.pointerId);}catch(err){}});
wrap.addEventListener('pointermove',function(e){if(!dragging)return;yaw+=(e.clientX-lx)*0.008;pitch=Math.max(-0.25,Math.min(0.45,pitch+(e.clientY-ly)*0.005));lx=e.clientX;ly=e.clientY;});
wrap.addEventListener('pointerup',function(e){
  var moved=Math.abs(e.clientX-sx)+Math.abs(e.clientY-sy);
  dragging=false;wrap.style.cursor='grab';
  if(moved<6)pick(e);
});
wrap.addEventListener('pointercancel',function(){dragging=false;wrap.style.cursor='grab';});

var v=new THREE.Vector3();
function frame(t){
  var s=t/1000;
  root.rotation.y=touched?yaw:yaw+Math.sin(s*0.5)*0.3;
  root.rotation.x=pitch;
  camera.position.set(0,dist*0.42,dist*0.9);camera.lookAt(0,0.4,0);
  renderer.render(scene,camera);
  for(var i=0;i<labels.length;i++){
    v.setFromMatrixPosition(labels[i].o.matrixWorld);v.project(camera);
    var px=(v.x*0.5+0.5)*w,py=(-v.y*0.5+0.5)*h;
    labels[i].el.style.transform='translate('+Math.round(px)+'px,'+Math.round(py)+'px) translate(-50%,-100%)';
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</main>
</body>
</html>
